apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
  labels:
    app: blue-green
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blue-green
      version: blue
  template:
    metadata:
      labels:
        app: blue-green
        version: blue
    spec:
      containers:
      - name: web
        image: blue-green-app:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: APP_COLOR
          value: "blue"
        - name: APP_VERSION
          value: "1.0.0"
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"

