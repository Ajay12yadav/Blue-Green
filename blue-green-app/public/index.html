<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue-Green Deployment Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.5s ease;
        }
        .card {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border-top: 6px solid var(--accent-color, #3b82f6);
        }
        h1 { margin-top: 0; font-size: 1.5rem; }
        .badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 1rem 0;
            background-color: var(--accent-color);
            color: white;
        }
        .meta {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-top: 0.5rem;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="card" id="card">
        <h1>Deployment Environment</h1>
        <div class="badge" id="badge">Loading...</div>
        <div class="meta" id="version">Version: --</div>
        <div class="meta" id="hostname">Host: --</div>
        <div class="meta" id="requests">Requests handled: --</div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                const card = document.getElementById('card');
                const badge = document.getElementById('badge');
                
                const colorCode = data.color === 'green' ? '#10b981' : '#3b82f6';
                card.style.setProperty('--accent-color', colorCode);
                
                badge.textContent = data.color;
                document.getElementById('version').textContent = `Version: ${data.version}`;
                document.getElementById('hostname').textContent = `Pod: ${data.hostname}`;
                document.getElementById('requests').textContent = `Requests handled: ${data.requests}`;
            } catch (err) {
                console.error('Failed to fetch status', err);
            }
        }
        fetchStatus();
        setInterval(fetchStatus, 3000);
    </script>
</body>
</html>
